# Smarti AI host configuration.
#
# Copy to config.yaml (ignored by git) and edit. Credentials are read from the
# environment: export CAM_USER=... and CAM_PASS=... before running.
#
# Nothing here has been validated on hardware. Values are starting points.

cameras:
  # Three approaches, one camera each, all on the wired Ethernet switch.
  # The role swap keeps each physical source where it was: the old main
  # camera is now SEC (.11), and the old side cameras are MAIN_A (.12) and
  # MAIN_B (.13). Use each camera's SUB-stream (720p, H.264, 5-15 fps).
  - id: cam_main_a
    approach: MAIN_A
    source: rtsp
    url: "rtsp://${CAM_USER}:${CAM_PASS}@192.168.50.12:554/stream2"
    flip: false
    target_fps: 8
    count_line: 0.4
    # polygon: [[0.1, 0.3], [0.9, 0.3], [1.0, 0.95], [0.0, 0.95]]

  - id: cam_main_b
    approach: MAIN_B
    source: rtsp
    url: "rtsp://${CAM_USER}:${CAM_PASS}@192.168.50.13:554/stream2"
    flip: false
    target_fps: 8
    count_line: 0.4

  - id: cam_sec
    approach: SEC
    source: rtsp
    url: "rtsp://${CAM_USER}:${CAM_PASS}@192.168.50.11:554/stream2"  # path varies by vendor
    flip: false
    target_fps: 8
    count_line: 0.4

  # --- Development without cameras -----------------------------------------
  # Replace the entries above with looping video files:
  #
  # - id: cam_main_a
  #   approach: MAIN_A
  #   source: file
  #   path: samples/main_a.avi
  #   loop: true
  #   realtime: true
  #   target_fps: 8
  #
  # Or a local webcam:
  #
  # - id: cam_main_a
  #   approach: MAIN_A
  #   source: webcam
  #   index: 0
  #   flip: true

decision:
  # Serving units: what the engine allocates green to. The current firmware
  # speaks only MAIN and SECONDARY, so MAIN_A + MAIN_B share the MAIN unit and
  # SEC is the SECONDARY unit in this compat layout. See the README.
  units:
    - id: MAIN
      approaches: [MAIN_A, MAIN_B]
    - id: SECONDARY
      approaches: [SEC]

  # Target T-junction layout. Requires gateway.mode: three_phase and firmware
  # support that does not exist yet. Uncommenting this alone is not enough.
  # units:
  #   - {id: MAIN_A, approaches: [MAIN_A]}
  #   - {id: MAIN_B, approaches: [MAIN_B]}
  #   - {id: SEC,    approaches: [SEC]}

  weights:
    queue: 1.0        # per vehicle inside the road region
    stationary: 1.5   # per stopped vehicle
    wait: 0.1         # per second the longest waiter has been stopped
    congestion: 1.0   # Low=0, Moderate=1, High=2
  base_green_s: 8
  k_green_s: 10
  score_saturation: 10   # score treated as "fully loaded"
  min_green_s: 5         # protocol range is 5-30; config may narrow it
  max_green_s: 30
  min_delta_s: 3         # ignore green changes of 3 s or less
  min_interval_s: 8      # never send requests faster than this
  max_wait_before_force_s: 60

  # Clearance values are placeholders that match the controller README; they
  # may differ in final firmware. The host never sends red or yellow.
  yellow_s: 3
  all_red_s: 1
  # Cap on estimated waiting time for a unit with demand. A single number
  # applies to every unit; a mapping caps units individually:
  # max_red_s: {MAIN: 90, SECONDARY: 120}
  max_red_s: 90
  green_memory_s: 120   # how long a sent green counts as this unit's expected green

  smoothing_window_s: 5
  max_metrics_age_s: 2
  idle_score_threshold: 1.0
  aggregation: sum       # sum|max for {MAIN_A, MAIN_B} -> MAIN demand
  require_all_approaches_healthy: true

# Gateway protocol mode.
#   compat_two_phase (default): current firmware, units MAIN + SECONDARY.
#   three_phase: T-junction target, NOT implemented in the firmware. It must be
#                enabled explicitly and the movement names stated explicitly.
#                The current ESP32/Uno reject them.
gateway:
  mode: compat_two_phase
  host: 192.168.4.1      # ESP32 SoftAP "Smarti-Gateway"; password via env only
  port: 3333
  connect_timeout_s: 3.0
  handshake_timeout_s: 2.0
  request_timeout_s: 2.0
  heartbeat_interval_s: 1.0
  reconnect_min_s: 1.0
  reconnect_max_s: 10.0
  request_backoff_s: 2.0

  # PROPOSAL ONLY -- disabled. Turn this on only when the firmware in
  # docs/FIRMWARE_THREE_PHASE_PROPOSAL.md exists. Names are unconfirmed.
  # three_phase:
  #   enabled: false
  #   movements:
  #     MAIN_A: MAIN_A
  #     MAIN_B: MAIN_B
  #     SEC: SECONDARY

health:
  max_frame_age_s: 2.0
  tick_interval_s: 1.0
  tick_timeout_s: 2.0
  required_cameras: 3    # null = all configured cameras

detection:
  model: yolo11n.pt
  device: auto           # auto|cuda|cpu
  confidence: 0.3
  # imgsz: 640             # overrides performance.imgsz

# Inference budget. auto = low on CPU-only machines with <= 8 GB RAM,
# otherwise balanced. Explicit values override the preset. Load shedding can
# step target_fps down to min_fps but never changes a health threshold.
performance:
  profile: auto           # auto|low|balanced|high
  # target_fps: 3         # low=3, balanced=5, high=8
  # imgsz: 480            # low=480, balanced/high=640
  # preview_fps: 5        # low=5, balanced=8, high=10
  # preview_scale: 0.5    # low=0.5, balanced=0.75, high=1.0
  # threads: 1            # torch threads per pipeline process
  # cv_threads: 1
  adaptive_fps: true
  min_fps: 2

logging:
  level: INFO
  decision_log: logs/decisions.jsonl
  max_bytes: 5242880
  backup_count: 3

display: false
